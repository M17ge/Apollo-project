<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Portal</title>
    <script type="module" src="supplier.js" defer></script>
    <link rel="stylesheet" href="supplier.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <a href="Landing.html" class="back-icon" title="Back to Landing Page">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Supplier Portal</h1>
    <p>Review and fulfill inventory restock requests</p>

    <!-- Pending Inventory Requests -->
    <div class="section">
        <h2>Pending Inventory Requests</h2>
        <table id="inventoryRequestsTable">
            <thead>
                <tr>
                    <th>Request ID</th>
                    <th>Description</th>
                    <th>Products Requested</th>
                    <th>Total Price</th>
                    <th>Requested By</th>
                    <th>Request Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Inventory requests will be populated here -->
            </tbody>
        </table>
    </div>

    <!-- Fulfill Request Form -->
    <div class="section">
        <h2>Fulfill Inventory Request</h2>
        <form id="fulfillmentForm">
            <input type="hidden" id="requestId">
            
            <label for="requestSelect">Select Request:</label>
            <select id="requestSelect" required>
                <option value="">Select a request to fulfill</option>
                <!-- Will be populated by JavaScript -->
            </select>
            
            <label for="supplierResponse">Supplier Response:</label>
            <select id="supplierResponse" required>
                <option value="accepted">Accept Request</option>
                <option value="partial">Partial Fulfillment</option>
                <option value="rejected">Reject Request</option>
            </select>
            
            <label for="availableQuantity">Available Quantity:</label>
            <input type="number" id="availableQuantity" placeholder="Quantity you can supply">
            
            <label for="quotedPrice">Quoted Price:</label>
            <input type="number" id="quotedPrice" placeholder="Your price quote" step="0.01">
            
            <label for="estimatedDelivery">Estimated Delivery Date:</label>
            <input type="date" id="estimatedDelivery">
            
            <label for="supplierNotes">Notes:</label>
            <textarea id="supplierNotes" placeholder="Additional notes about the fulfillment..."></textarea>
            
            <button type="submit" id="submitFulfillment">Submit Response</button>
        </form>
    </div>
</body>
</html>
