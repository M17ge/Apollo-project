<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Management</title>
    <script type="module" src="learning.js" defer></script>
    <link rel="stylesheet" href="learning.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <a href="Landing.html" class="back-icon" title="Back to Landing Page">
        <i class="fas fa-arrow-left"></i></a>
    <h1>Training Management</h1>
    <p>Manage training bookings</p>

    <!-- Training Booking Form -->
    <div class="section">
        <h2>Training Booking Form</h2>
        <form id="bookingForm">
            <input type="hidden" id="bookingId">
            
            <label for="certification_id">Certification:</label>
            <select id="certification_id" required>
                <option value="">Select a certification</option>
                <!-- Will be populated by JavaScript -->
            </select>
            
            <label for="farmer_id">Farmer:</label>
            <select id="farmer_id" required>
                <option value="">Select a farmer</option>
                <!-- Will be populated by JavaScript -->
            </select>
            
            <label for="trainer_id">Trainer:</label>
            <select id="trainer_id" required>
                <option value="">Select a trainer</option>
                <!-- Will be populated by JavaScript -->
            </select>
            
            <label for="expected_start_time">Expected Start Time:</label>
            <input type="datetime-local" id="expected_start_time" required>
            
            <label for="training_location">Training Location:</label>
            <input type="text" id="training_location" placeholder="Enter training location">
            
            <label for="booked">Booking Status:</label>
            <select id="booked" required>
                <option value="false">Pending</option>
                <option value="true">Confirmed</option>
            </select>
            
            <button type="submit" id="submitBooking">Add Booking</button>
        </form>
        
        <!-- Training Bookings Table -->
        <h3>Training Bookings</h3>
        <table id="bookingsTable">
            <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>Certification</th>
                    <th>Farmer</th>
                    <th>Trainer</th>
                    <th>Start Time</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Booking data will be populated here -->
            </tbody>
        </table>
    </div>
</body>
</html>
